<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sampark · Officials Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f2;--sf:#fff;--ink:#14201c;--mu:#66736d;--ln:rgba(20,32,28,.09);--br:#0f6b57;--br2:#1aa583;--soft:#e4f2ec;--onb:#fff;--dg:#c0392b;--sh:0 1px 2px rgba(20,32,28,.05),0 8px 24px -12px rgba(20,32,28,.15);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b110f;--sf:#141c19;--ink:#e8efec;--mu:#8b9a94;--ln:rgba(255,255,255,.08);--br:#3ddc97;--br2:#2bb57a;--soft:#15302a;--onb:#05241a;--dg:#ef7a6c;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b110f;--sf:#141c19;--ink:#e8efec;--mu:#8b9a94;--ln:rgba(255,255,255,.08);--br:#3ddc97;--br2:#2bb57a;--soft:#15302a;--onb:#05241a;--dg:#ef7a6c;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--br),var(--br2));color:var(--onb);display:grid;place-items:center;font-weight:700;letter-spacing:-.02em}
.brand b{display:block;font-size:1.02rem;letter-spacing:-.01em}.brand small{color:var(--mu);font-size:.76rem}
main{max-width:720px;margin:0 auto;padding:14px 16px 120px}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;transition:transform .12s,background .2s,opacity .2s}
button:active{transform:scale(.96)}
.pill{padding:8px 14px;border-radius:99px;background:var(--soft);color:var(--br);font-weight:600;font-size:.85rem}
.lbl{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:16px 2px 8px}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 1px 6px}.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:99px;background:var(--sf);box-shadow:var(--sh);border:1px solid var(--ln);font-weight:500;font-size:.86rem;white-space:nowrap}
.chip i{font-style:normal;color:var(--mu);margin-left:6px;font-size:.78rem}
.chip.on{background:linear-gradient(135deg,var(--br),var(--br2));color:var(--onb);border-color:transparent}.chip.on i{color:inherit;opacity:.8}
.seg{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:4px;box-shadow:var(--sh)}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-size:.8rem;font-weight:600;color:var(--mu);line-height:1.2}
.seg button b{display:block;font-size:1.05rem;color:var(--ink);font-weight:700}
.seg button.on{background:var(--soft);color:var(--br)}.seg button.on b{color:var(--br)}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fl .q{grid-column:1/-1}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);outline:0;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--br);box-shadow:0 0 0 3px color-mix(in srgb,var(--br) 18%,transparent)}
.lh{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 4px;color:var(--mu);font-size:.82rem}
.lh button{color:var(--br);font-weight:600}
.og{font-weight:600;font-size:.8rem;color:var(--mu);margin:14px 2px 8px}
.card{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:var(--sh);animation:up .35s both}
.card.on{border-color:var(--br);background:color-mix(in srgb,var(--soft) 60%,var(--sf))}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.av{width:44px;height:44px;border-radius:50%;color:#fff;font-weight:600;font-size:.92rem;display:grid;place-items:center;flex:0 0 auto}
.av svg{width:20px;height:20px}
.inf{flex:1;min-width:0}.nm{font-weight:600;letter-spacing:-.01em}.ds{color:var(--mu);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg span{display:inline-block;font-size:.68rem;font-weight:600;color:var(--br);background:var(--soft);padding:2px 8px;border-radius:99px;margin:5px 4px 0 0}
.ac{display:flex;gap:6px}.ac button{width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--br);display:grid;place-items:center}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:18px;height:18px}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:12;width:calc(100% - 28px);max-width:460px;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:8px;box-shadow:0 14px 40px -10px rgba(0,0,0,.5);animation:up .25s}
.bar span{flex:1;font-weight:600}.bar button{padding:10px 16px;border-radius:12px;font-weight:600}
.bar .go{background:linear-gradient(135deg,var(--br),var(--br2));color:var(--onb)}.bar .x{color:var(--bg);opacity:.7}
#ov{position:fixed;inset:0;background:rgba(5,10,8,.5);z-index:20;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
#ov.on{display:flex}
#sheet{background:var(--sf);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:sl .3s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{transform:translateY(40px);opacity:0}}
#sheet h2{margin:0 0 4px;font-size:1.15rem;letter-spacing:-.01em}#sheet p{color:var(--mu);margin:0 0 12px;font-size:.88rem}
.btn{padding:12px 16px;border-radius:12px;font-weight:600;background:var(--soft);color:var(--br)}
.btn.p{background:linear-gradient(135deg,var(--br),var(--br2));color:var(--onb)}.btn.d{color:var(--dg);background:color-mix(in srgb,var(--dg) 12%,transparent)}
.g{display:grid;gap:8px;margin:10px 0}.g2{grid-template-columns:1fr 1fr}.fx{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.fx>*{flex:1}
.ck{display:flex;gap:8px;align-items:center;font-size:.88rem}.ck input{width:18px;height:18px;accent-color:var(--br)}
.empty{text-align:center;color:var(--mu);padding:40px 16px}.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
#gate{position:fixed;inset:0;background:var(--bg);z-index:30;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mu)}
.sp{width:28px;height:28px;border-radius:50%;border:3px solid var(--ln);border-top-color:var(--br);animation:r 1s linear infinite;margin:0 auto 12px}@keyframes r{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.86rem;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90%}
#toast.s{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">S</div><div><b>Sampark</b><small id="sub">Officials directory</small></div></div>
  <button class="pill" id="gear" hidden>Manage</button>
</header>
<main>
  <div class="lbl" style="margin-top:4px">Scheme</div><div class="row" id="chips"></div>
  <div class="lbl">Level</div><div class="seg" id="seg"></div>
  <div class="fl"><input class="q" id="q" placeholder="Search name or number" type="search"><select id="fd"></select><select id="fo"></select></div>
  <div id="list"></div>
</main>
<div id="bar"></div>
<div id="ov"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="gate"><div><div class="sp"></div>Opening directory…</div></div>
<input type="file" id="fp" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx,image/*,application/pdf" multiple hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=id=>document.getElementById(id),LV=["Block Level","Gram Panchayat","Line Department"];
const ST={"Block Level":["Ramnagar-I Development Block"],"Line Department":["Food & Supply","Agriculture","Health","Land","CDPO","School Education","Bank","Animal Husbandry","Fishery"],"Gram Panchayat":["Talgachhari-I","Talgachhari-II","Haldia-I","Haldia-II","Padima-I","Padima-II","Gobra","Basantapur","Badhia"]};
const canon=s=>{s=String(s||"").trim();for(const l in ST){const m=ST[l].find(x=>x.toLowerCase()===s.toLowerCase());if(m)return[l,m]}return[null,s]};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const I={ph:'<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',ch:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',cl:'<svg viewBox="0 0 24 24"><path d="M20 11l-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/></svg>',ck:'<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>'};
let LOCAL=0,DB=null,U=null,admin=false,off=[],sch=[],level="All",cs="",sel=new Set(),got=0,tgt=null,fpMode="";
const H=s=>Array.from(String(s)).reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const hid=s=>"s"+H(s),fixp=s=>{s=String(s||"").replace(/\D/g,"");return s.length===10?"91"+s:s};
const lvl=s=>{s=String(s).toLowerCase();return s.includes("block")?LV[0]:/gram|gp|panch/.test(s)?LV[1]:LV[2]};
const ini=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const uniq=a=>a.filter((x,i)=>x&&a.indexOf(x)===i).sort();
let tt;function toast(t){const e=$("toast");e.textContent=t;e.className="s";clearTimeout(tt);tt=setTimeout(()=>e.className="",3200)}
const sheet=h=>{$("sheet").innerHTML=h;$("ov").className="on"},closeS=()=>{$("ov").className=""};
$("ov").onclick=e=>{if(e.target.id==="ov")closeS()};

/* local mode: used when the page is hosted outside Claude (e.g. GitHub Pages); data stays on this phone */
function localDB(){
  const K="sampark_v1";let d;try{d=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){d={}}
  d.officials=d.officials||{};d.schemes=d.schemes||{};const subs={};
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}};
  const snap=c=>({docs:Object.entries(d[c]).map(([id,v])=>({id,data:()=>v}))});
  const fire=c=>(subs[c]||[]).forEach(f=>f(snap(c)));
  return{collection:c=>({onSnapshot(cb){(subs[c]=subs[c]||[]).push(cb);setTimeout(()=>cb(snap(c)),0)},async add(v){const id="o"+Date.now()+Math.random().toString(36).slice(2,7);d[c][id]=v;save();fire(c);return{id}}}),
  doc:p=>{const[c,id]=p.split("/");return{async set(v){d[c][id]=v;save();fire(c)},async update(v){d[c][id]={...d[c][id],...v};save();fire(c)},async delete(){delete d[c][id];save();fire(c)}}}}
}
/* data */
(async()=>{
  const t=setTimeout(()=>{if(!DB)$("gate").innerHTML='<div><b style="color:var(--ink)">Sign in to open Sampark</b><br>Open this link in the Claude app or browser while signed in to Claude. Ask the admin for access if you do not have it.</div>'},10000);
  try{if(typeof claude!=="undefined"){U=await claude.use("user");DB=await claude.use("db")}}catch(e){}if(!DB){try{DB=localDB();U={canEdit:()=>true};LOCAL=1}catch(e){return}}
  if(!DB)return;clearTimeout(t);
  admin=!!(U&&U.canEdit());$("gear").hidden=!admin;
  const fin=()=>{if(++got>=2){$("gate").style.display="none"}render()};
  const er=e=>toast("Could not load: "+(e&&e.message||"error"));
  let f1=0,f2=0;
  DB.collection("officials").onSnapshot(s=>{off=s.docs.map(d=>({id:d.id,...d.data()}));if(!f1){f1=1;fin()}else render()},er);
  DB.collection("schemes").onSnapshot(s=>{sch=s.docs.map(d=>d.data().name).filter(Boolean).sort();if(!f2){f2=1;fin()}else render()},er);
})();

/* render */
const sch_of=o=>o.schemes||[];
function render(){
  const b=off.filter(o=>!cs||sch_of(o).includes(cs));
  $("sub").textContent=cs?cs:LOCAL?"Saved on this phone · "+off.length+" officials":"Ramnagar-I Block · "+off.length+" officials";
  $("chips").innerHTML=[""].concat(sch).map(x=>`<button class="chip ${x===cs?"on":""}" data-sc="${esc(x)}">${x?esc(x):"All schemes"}<i>${off.filter(o=>!x||sch_of(o).includes(x)).length}</i></button>`).join("");
  $("seg").innerHTML=[["All","All"],[LV[0],"Block"],[LV[1],"Gram Panchayat"],[LV[2],"Line Dept"]].map(([v,l])=>`<button class="${v===level?"on":""}" data-lv="${v}"><b>${b.filter(o=>v==="All"||o.level===v).length}</b>${l}</button>`).join("");
  const lb=b.filter(o=>level==="All"||o.level===level);
  const fill=(id,lab,v)=>{const s=$(id),c=s.value;s.innerHTML=`<option value="">${lab}</option>`+v.map(x=>`<option>${esc(x)}</option>`).join("");if(v.includes(c))s.value=c};
  fill("fd","All designations",uniq(lb.map(o=>o.designation)));fill("fo","All offices",uniq(lb.map(o=>o.office).concat(level==="All"?Object.values(ST).flat():(ST[level]||[]))));
  const d=$("fd").value,f=$("fo").value,q=$("q").value.toLowerCase();
  const s=lb.filter(o=>(!d||o.designation===d)&&(!f||o.office===f)&&(!q||(o.name+o.phone).toLowerCase().includes(q)));
  window.shownList=s;
  const g={};s.forEach(o=>(g[o.office]=g[o.office]||[]).push(o));
  let n=0;
  $("list").innerHTML=s.length?`<div class="lh"><span>${s.length} officials</span><button data-act="all">${s.every(o=>sel.has(o.id))?"Deselect all":"Select all"}</button></div>`+Object.keys(g).sort().map(k=>`<div class="og">${esc(k)}</div>`+g[k].sort((a,b)=>a.name.localeCompare(b.name)).map(o=>{const on=sel.has(o.id);return`<div class="card ${on?"on":""}" style="animation-delay:${Math.min(n++,10)*25}ms"><button class="av" data-act="tog" data-id="${o.id}" style="background:hsl(${H(o.name)%360} 42% 40%)">${on?I.ck:esc(ini(o.name))}</button><div class="inf"><div class="nm">${esc(o.name)}</div><div class="ds">${esc(o.designation)} · +${esc(o.phone)}</div><div class="tg">${sch_of(o).map(x=>`<span>${esc(x)}</span>`).join("")}</div></div><div class="ac"><button data-act="call" data-id="${o.id}" aria-label="Call">${I.ph}</button><button data-act="chat" data-id="${o.id}" aria-label="WhatsApp">${I.ch}</button><button data-act="file" data-id="${o.id}" aria-label="Send file">${I.cl}</button></div></div>`}).join("")).join(""):`<div class="empty"><b>No officials here yet</b>${admin?'Tap Manage to add or import from Excel.':'The admin has not added anyone to this view.'}</div>`;
  $("bar").innerHTML=sel.size?`<div class="bar"><span>${sel.size} selected</span><button class="x" data-act="clr">Clear</button><button class="go" data-act="bulk">Send</button></div>`:"";
}
$("q").oninput=render;$("fd").onchange=$("fo").onchange=render;
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const D=b.dataset,a=D.act,o=D.id&&off.find(x=>x.id===D.id);
  if(D.sc!==undefined&&b.classList.contains("chip")){cs=D.sc;$("fd").value="";$("fo").value="";return render()}
  if(D.lv){level=D.lv;$("fd").value="";$("fo").value="";return render()}
  if(a==="tog"){sel.has(D.id)?sel.delete(D.id):sel.add(D.id);render()}
  else if(a==="all"){const all=window.shownList.every(x=>sel.has(x.id));window.shownList.forEach(x=>all?sel.delete(x.id):sel.add(x.id));render()}
  else if(a==="clr"){sel.clear();render()}
  else if(a==="chat")wa(o,"");
  else if(a==="call"){wa(o,"");toast("Chat opened. Tap the call icon in WhatsApp.")}
  else if(a==="file"){tgt=o;fpMode="one";$("fp").click()}
  else if(a==="bulk")bulk();
});
const wa=(o,t)=>window.open("https://wa.me/"+o.phone+(t?"?text="+encodeURIComponent(t):""),"_blank","noopener");
async function share(o,t,fl){
  try{if(fl.length&&navigator.canShare&&navigator.canShare({files:fl})){toast("Choose WhatsApp, then "+o.name);await navigator.share({files:fl,text:t||undefined});return}}catch(e){if(e&&e.name==="AbortError")return}
  wa(o,t);if(fl.length)toast("Attach the file in the chat with the + button.");
}
$("fp").onchange=e=>{const fl=[...e.target.files];e.target.value="";if(!fl.length)return;if(fpMode==="one"&&tgt)share(tgt,"",fl);else if(fpMode==="bulk"){bf=fl;bulk(true)}};

/* bulk send */
let bf=[],bt="",bq=[],bi=0;
function bulk(keep){
  if(!keep)bf=[];const n=sel.size;
  sheet(`<h2>Send to ${n} official${n>1?"s":""}</h2><p>WhatsApp sends one chat at a time, so I will take you through each person.</p><textarea id="bt" rows="3" placeholder="Message (optional)">${esc(bt)}</textarea><div class="fx"><button class="btn" id="bff">${bf.length?bf.length+" file(s) attached · change":"Attach PDF or image"}</button></div><div class="fx"><button class="btn" id="bc">Cancel</button><button class="btn p" id="bs">Start</button></div>`);
  $("bff").onclick=()=>{bt=$("bt").value;fpMode="bulk";$("fp").click()};$("bc").onclick=closeS;
  $("bs").onclick=()=>{bt=$("bt").value.trim();bq=off.filter(o=>sel.has(o.id));bi=0;step()};
}
function step(){
  if(bi>=bq.length){sheet(`<h2>All done</h2><p>You went through ${bq.length} officials.</p><div class="fx"><button class="btn p" id="bd">Close</button></div>`);$("bd").onclick=()=>{sel.clear();closeS();render()};return}
  const o=bq[bi];
  sheet(`<p>${bi+1} of ${bq.length}</p><h2>${esc(o.name)}</h2><p>${esc(o.designation)} · ${esc(o.office)}<br>+${esc(o.phone)}</p><div class="fx"><button class="btn p" id="s1">${bf.length?"Share file in WhatsApp":"Open WhatsApp chat"}</button><button class="btn" id="s2">Call</button></div><div class="fx"><button class="btn" id="s3">Next</button><button class="btn" id="s4">Stop</button></div>`);
  $("s1").onclick=()=>bf.length?share(o,bt,bf):wa(o,bt);$("s2").onclick=()=>{wa(o,"");toast("Tap the call icon in WhatsApp.")};
  $("s3").onclick=()=>{bi++;step()};$("s4").onclick=closeS;
}

/* admin */
const sc=(id)=>sch.map(x=>`<label class="ck"><input type="checkbox" value="${esc(x)}"> ${esc(x)}</label>`).join("")||'<span class="ds">Add a scheme first.</span>';
$("gear").onclick=()=>manage("add");
function manage(t){
  const tabs=[["add","Add"],["excel","Excel"],["sch","Schemes"],["sel","Selected"]].concat(LOCAL?[["bk","Backup"]]:[]);
  let body="";
  if(t==="add")body=`<div class="g g2"><select id="mc">${LV.map(l=>`<option>${l}</option>`).join("")}</select><select id="mo"></select><input id="md" placeholder="Designation" list="dl"><datalist id="dl"><option>BDO<option>Joint BDO<option>Block Engineer<option>Assistant Engineer<option>Pradhan<option>Upa-Pradhan<option>Secretary<option>Nirman Sahayak<option>Executive Assistant<option>CDPO<option>Medical Officer<option>Agriculture Officer<option>Inspector</datalist><input id="mn" placeholder="Name"><input id="mp" placeholder="Phone" inputmode="tel" style="grid-column:1/-1"></div><div class="g" id="mk">${sc()}</div><div class="fx"><button class="btn p" id="ma">Add official</button></div>`;
  if(t==="bk")body=`<p>Data is saved only on this phone. Save a backup file, or restore one here.</p><div class="fx"><button class="btn p" id="bkx">Save backup file</button></div><div class="g"><input type="file" id="bki" accept=".json"></div>`;
  if(t==="excel")body=`<p>First sheet, columns A to F: category, office, designation, name, phone, schemes (separate several with commas). Use exact office names such as Talgachhari-I or Agriculture. Header row optional. 10-digit numbers get 91 added.</p><input type="file" id="mx" accept=".xlsx,.xls,.csv"><div class="fx"><button class="btn" id="msamp">Load sample data</button></div>`;
  if(t==="sch")body=`<div class="g g2" style="grid-template-columns:1fr auto"><input id="mn2" placeholder="New scheme, e.g. VBTC"><button class="btn p" id="mas">Add</button></div><div class="fx" style="flex-wrap:wrap">${sch.map(x=>`<button class="btn d" data-ds="${esc(x)}" style="flex:0 0 auto">${esc(x)} ✕</button>`).join("")||'<span class="ds">No schemes yet.</span>'}</div>`;
  if(t==="sel")body=`<p>${sel.size} official(s) selected in the list.</p><select id="ms">${sch.map(x=>`<option>${esc(x)}</option>`).join("")}</select><div class="fx"><button class="btn p" id="mad">Add to scheme</button><button class="btn" id="mrm">Remove</button></div><div class="fx"><button class="btn d" id="mdel">Delete selected officials</button></div>`;
  sheet(`<h2>Manage</h2><div class="seg" style="margin:10px 0 12px">${tabs.map(([k,l])=>`<button class="${k===t?"on":""}" data-mt="${k}">${l}</button>`).join("")}</div>${body}`);
  document.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>manage(b.dataset.mt));
  const run=async(fn,msg)=>{try{await fn();if(msg)toast(msg)}catch(e){toast(e&&e.code==="not_granted"?"Only admins can change data.":"Could not save: "+(e&&e.message||"error"))}};
  const O=DB.collection("officials");
  if(t==="bk"){$("bkx").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([localStorage.getItem("sampark_v1")||"{}"],{type:"application/json"}));a.download="sampark-backup.json";a.click()};
    $("bki").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{JSON.parse(r.result);localStorage.setItem("sampark_v1",r.result);location.reload()}catch(x){toast("Not a valid backup file.")}};r.readAsText(f)}}
  if(t==="add"){const fo=()=>{$("mo").innerHTML=ST[$("mc").value].map(x=>`<option>${esc(x)}</option>`).join("")};$("mc").onchange=fo;fo()}
  if(t==="add")$("ma").onclick=()=>{const p=fixp($("mp").value),n=$("mn").value.trim();if(!n||p.length<8){toast("Enter a name and a valid phone number.");return}
    run(async()=>{await O.add({level:$("mc").value,office:$("mo").value.trim()||"Unassigned",designation:$("md").value.trim(),name:n,phone:p,schemes:[...document.querySelectorAll("#mk input:checked")].map(x=>x.value)});["md","mn","mp"].forEach(i=>$(i).value="")},"Official added.")};
  if(t==="excel"){
    $("mx").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>run(async()=>{
      const wb=XLSX.read(r.result,{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""}),list=[];
      rows.forEach(c=>{const p=fixp(c[4]);if(p.length<8||!c[3])return;const [L,Of]=canon(c[1]);list.push({level:L||lvl(String(c[0])),office:Of||"Unassigned",designation:String(c[2]),name:String(c[3]),phone:p,schemes:String(c[5]||"").split(/[,;]/).map(x=>x.trim()).filter(Boolean)})});
      const ns=uniq(list.flatMap(o=>o.schemes)).filter(x=>!sch.includes(x));
      for(const x of ns)await DB.doc("schemes/"+hid(x)).set({name:x});
      for(let i=0;i<list.length;i+=10)await Promise.all(list.slice(i,i+10).map(o=>O.add(o)));
      toast(list.length+" officials imported.")});r.readAsArrayBuffer(f)};
    $("msamp").onclick=()=>run(async()=>{const S="SBM (Swachh Bharat Mission)";await DB.doc("schemes/"+hid(S)).set({name:S});
      const d=[[LV[0],"Ramnagar-I Development Block","BDO","Anil Kumar","919800000001"],[LV[0],"Ramnagar-I Development Block","Block Engineer","Ravi Singh","919800000002"],[LV[1],"Talgachhari-I","Nirman Sahayak","Suresh Yadav","919800000003"],[LV[1],"Haldia-II","Nirman Sahayak","Rakesh Das","919800000005"],[LV[2],"Agriculture","Block Agriculture Officer","Amit Verma","919800000006"]];
      for(const x of d)await O.add({level:x[0],office:x[1],designation:x[2],name:x[3],phone:x[4],schemes:x[3]==="Amit Verma"?[]:[S]})},"Sample data added.");
  }
  if(t==="sch"){
    $("mas").onclick=()=>{const n=$("mn2").value.trim();if(n)run(async()=>{await DB.doc("schemes/"+hid(n)).set({name:n});manage("sch")})};
    document.querySelectorAll("[data-ds]").forEach(b=>b.onclick=()=>{const n=b.dataset.ds;if(!confirm("Delete scheme "+n+"? Officials stay; only the tag is removed."))return;
      run(async()=>{await DB.doc("schemes/"+hid(n)).delete();for(const o of off.filter(o=>sch_of(o).includes(n)))await DB.doc("officials/"+o.id).update({schemes:sch_of(o).filter(x=>x!==n)});if(cs===n)cs=""})});
  }
  if(t==="sel"){
    const up=add=>{const v=$("ms").value;if(!sel.size||!v){toast("Select officials in the list first.");return}
      run(async()=>{for(const o of off.filter(o=>sel.has(o.id))){const s=sch_of(o).filter(x=>x!==v);if(add)s.push(v);await DB.doc("officials/"+o.id).update({schemes:s})}},"Updated.")};
    $("mad").onclick=()=>up(true);$("mrm").onclick=()=>up(false);
    $("mdel").onclick=()=>{if(sel.size&&confirm("Delete "+sel.size+" official(s)?"))run(async()=>{for(const id of [...sel])await DB.doc("officials/"+id).delete();sel.clear();closeS()},"Deleted.")};
  }
}
</script>
</body>
</html>
